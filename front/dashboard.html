<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lixeiras Inteligentes</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Leaflet -->
    <link rel="stylesheet"
        href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <!-- CSS próprio -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">Sistema de Lixeiras Inteligentes</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="dashboard.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="lixeiras.html">Lixeiras</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Conteúdo -->
    <div class="container mt-4">

        <!-- Cards -->
        <div class="row mb-4">

            <div class="col-md-4">
                <div class="status-card">
                    <h5>Lixeiras Ativas</h5>
                    <h2 id="totalBins">0</h2>
                </div>
            </div>

            <div class="col-md-4">
                <div class="status-card">
                    <h5>Lixeiras Cheias</h5>
                    <h2 id="fullBins">0</h2>
                </div>
            </div>

            <div class="col-md-4">
                <div class="status-card">
                    <h5>Alertas</h5>
                    <h2 id="alerts">0</h2>
                </div>
            </div>

        </div>

        <!-- Nova lixeira -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="status-card">
                    <h5>Adicionar nova lixeira</h5>
                    <form id="newBinForm" class="row g-3 align-items-end">
                        <div class="col-md-3">
                            <label class="form-label">Nome</label>
                            <input type="text" id="binName" class="form-control" required>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Latitude</label>
                            <input type="number" id="binLat" class="form-control" step="any" required>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Longitude</label>
                            <input type="number" id="binLng" class="form-control" step="any" required>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Ocupação %</label>
                            <input type="number" id="binOccupancy" class="form-control" min="0" max="100" required>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Tampa</label>
                            <select id="binLid" class="form-select">
                                <option value="fechada">fechada</option>
                                <option value="aberta">aberta</option>
                            </select>
                        </div>
                        <div class="col-md-1 d-grid">
                            <button class="btn btn-success">Adicionar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Mapa -->
        <div id="map"></div>

    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script src="../js/api.js"></script>
    <script src="../js/map.js"></script>
    <script src="../js/dashboard.js"></script>

</body>

</html>
